name: iOS - Run Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ios-unit-tests:
    name: Run iOS unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The app's "Build shared" build phase runs
      # `./gradlew :shared:embedAndSignAppleFrameworkForXcode`, so the KMP
      # toolchain (JDK) must be available during the Xcode build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pick an available iPhone simulator on the runner so we don't hard-code a
      # device name/OS that may not exist on a given Xcode image.
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); ids=[dev['udid'] for rt,devs in d['devices'].items() if 'iOS' in rt for dev in devs if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
