name: Android - Quality Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Spotless and Detekt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run spotless check
        run: ./gradlew spotlessCheck --no-configuration-cache

      - name: Run detekt check
        run: ./gradlew detekt

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew androidApp:testDebugUnitTest

      - name: Run shared module unit tests
        run: ./gradlew shared:allTests

      - name: Run web app unit tests
        run: ./gradlew :webApp:wasmJsTest

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            androidApp/build/test-results/
            shared/build/test-results/
            webApp/build/test-results/

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            androidApp/build/reports/tests/
            shared/build/reports/tests/

      - name: Publish test summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            androidApp/build/test-results/**/*.xml
            shared/build/test-results/**/*.xml

  screenshot-tests:
    name: Verify Compose screenshot tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Compose preview screenshot tests
        run: ./gradlew :androidApp:validateDebugScreenshotTest --stacktrace

      - name: Upload screenshot test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: androidApp/build/reports/screenshotTest/preview/debug/
